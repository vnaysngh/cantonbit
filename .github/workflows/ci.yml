name: CI

on:
  push:
    branches: [main, master, feat/**]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build:prod

  solver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swap-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: swap-solver/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
