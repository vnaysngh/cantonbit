[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
# OpenZeppelin (via vendored lib path). Legacy OIF contracts were removed.
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
